name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NEXT_PUBLIC_* vars are inlined into the client bundle at build
          # time, so they must be present here (not just as a Worker runtime
          # variable) for Sanity-backed pages to render in production.
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      # RESEND_API_KEY is read at request time inside the Worker (the
      # booking/contact/lead API routes), not baked in at build time, so it
      # has to be pushed as a Worker secret rather than passed as a build env
      # var above. Re-running this on every deploy keeps it in sync with the
      # GitHub secret without needing anyone to touch the Cloudflare
      # dashboard by hand. The emptiness check happens in bash (not a GH
      # Actions `if:` on the secrets context) to sidestep this action's
      # workflow-level failure the shorter `if:` version triggered.
      - name: Sync RESEND_API_KEY to the Cloudflare Worker
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY repo secret not set yet — skipping sync."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Behaviour-tracking pipeline (see scripts/tracking/Code.gs and
      # app/api/track). Same pattern as above: each value lives as a GitHub
      # repo secret and is pushed to the Worker on every deploy; empty ones
      # are skipped so the site keeps working (tracking just drops batches).
      - name: Sync tracking secrets to the Cloudflare Worker
        run: |
          for name in TRACKING_WEBHOOK_URL TRACKING_TOKEN HEATMAP_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "$name repo secret not set yet — skipping sync."
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRACKING_WEBHOOK_URL: ${{ secrets.TRACKING_WEBHOOK_URL }}
          TRACKING_TOKEN: ${{ secrets.TRACKING_TOKEN }}
          HEATMAP_KEY: ${{ secrets.HEATMAP_KEY }}
