name: Deploy Sanity Studio

# Studio builds need more RAM than the office laptop has free, so it is
# built here. Runs when the schema changes or on demand (Actions tab → Run).
# Needs repo secret SANITY_DEPLOY_TOKEN = a Sanity API token with the
# "Deploy Studio" permission (the SANITY_API_TOKEN robot is only an editor
# and cannot deploy). Without it the job skips with a warning.
# Secret added by the owner 2026-11-03 (Developer/Administrator role: the
# CLI needs sanity.project.read, "Deploy Studio (Token only)" is not enough).
# Owner re-checked token role + secret 2026-11-03.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - ".github/workflows/deploy-studio.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
    steps:
      - name: Check deploy token
        id: token
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::warning::Missing secret SANITY_DEPLOY_TOKEN (Sanity token with Deploy Studio permission) — Studio not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - name: Deploy Studio
        if: steps.token.outputs.ok == 'true'
        run: |
          set -o pipefail
          if ! npx sanity deploy -y 2>&1 | tee deploy.log; then
            # Surface the tail of the log as annotations (readable without
            # login); GitHub masks the secret value automatically.
            tail -n 25 deploy.log | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
