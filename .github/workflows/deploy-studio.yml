name: Deploy Sanity Studio

# Studio builds need more RAM than the office laptop has free, so it is
# built here. Runs when the schema changes or on demand (Actions tab → Run).
# Needs repo secret SANITY_DEPLOY_TOKEN = a Developer token created INSIDE
# project 0lzmbuzo (owner account: Google sign-in). A token from any other
# Sanity project fails with "missing grant sanity.project.read".
# Without the secret the job skips with a warning.
# Token re-created in project 0lzmbuzo by the owner 2026-11-03; the Editor
# role lacks deployStudio/deploySchema, so it was replaced with Administrator.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - ".github/workflows/deploy-studio.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
    steps:
      - name: Check deploy token
        id: token
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::warning::Missing secret SANITY_DEPLOY_TOKEN (Sanity token with Deploy Studio permission) — Studio not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # Which Sanity role does this token have? (prints names only, never the token)
            ROLES=$(curl -s -H "Authorization: Bearer $SANITY_AUTH_TOKEN" https://api.sanity.io/v2021-06-07/users/me \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log((j.name||'?')+' | roles: '+(j.roles||[]).map(r=>r.name).join(','))}catch{console.log('unreadable response')}})")
            echo "::notice::SANITY_DEPLOY_TOKEN belongs to: ${ROLES}"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - name: Deploy Studio
        if: steps.token.outputs.ok == 'true'
        env:
          EDITOR_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          set -o pipefail
          # Surface a log's tail as annotations (readable without login);
          # GitHub masks secret values automatically.
          report() { tail -n 12 "$1" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r line; do echo "::$2::[$3] ${line}"; done; }
          # 1) Deploy token (SANITY_DEPLOY_TOKEN).
          if npx sanity deploy -y 2>&1 | tee deploy.log; then
            echo "::notice::Studio deployed with SANITY_DEPLOY_TOKEN"; exit 0
          fi
          report deploy.log warning deploy-token
          # 2) Fallback: the editor robot (SANITY_API_TOKEN), which can read the project.
          if [ -n "$EDITOR_TOKEN" ] && SANITY_AUTH_TOKEN="$EDITOR_TOKEN" npx sanity deploy -y 2>&1 | tee deploy2.log; then
            echo "::notice::Studio deployed with SANITY_API_TOKEN (editor)"; exit 0
          fi
          report deploy2.log error editor-token
          exit 1
